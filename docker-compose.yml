services:
  67xui:
    # Pre-built image from GitHub Container Registry — no local build required.
    # On a fresh server: docker compose pull && docker compose up -d
    image: ghcr.io/b1rub1/67xui:main
    container_name: 67xui_app

    # AmneziaWG / WireGuard UDP does NOT work reliably through docker-proxy
    # (bridge publish). Host networking lets awg1 bind :51820 directly on
    # the host — required for client handshakes.
    network_mode: host
    privileged: true

    # TUN device for amneziawg-go userspace (kernel module usually absent).
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - $PWD/db/:/etc/x-ui/
      # Host certs (same paths as stock 3x-ui). Do NOT mount $PWD/cert —
      # that shadows /root/cert and breaks HTTPS.
      - /root/cert:/root/cert
      - /root/.acme.sh:/root/.acme.sh
      - /lib/modules:/lib/modules:ro

    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # Avoid clash with stock 3x-ui on the same host (2053 / 2096).
      XUI_PORT: "2054"
      XUI_SUB_PORT: "2097"

    tty: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: 67xui_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
