services:
  67xui:
    # Pre-built image from GitHub Container Registry — no local build required.
    # On a fresh server: docker compose pull && docker compose up -d
    image: ghcr.io/b1rub1/67xui:main
    # To build locally instead, comment out 'image' above and uncomment below:
    # build:
    #   context: .
    #   dockerfile: ./Dockerfile
    container_name: 67xui_app
    # hostname: yourhostname  # optional

    # AmneziaWG creates kernel network interfaces — the container must have
    # full capability to manage them.  Install the AWG kernel module on the
    # HOST before starting:
    #   apt install amneziawg   (Debian/Ubuntu via amnezia PPA)
    #   modprobe amneziawg
    # The module lives on the host kernel; the container shares it and only
    # needs the userspace tools (awg, awg-quick) that are baked into the image.
    privileged: true
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
      - $PWD/acme/:/root/.acme.sh/
      # Expose host kernel modules so awg-quick can load amneziawg if needed.
      - /lib/modules:/lib/modules:ro
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # Panel runs on port 2054 to avoid conflict with a stock 3x-ui on 2053.
      # Change both XUI_PORT and the ports mapping below if you need a different port.
      XUI_PORT: "2054"
      # XUI_GOGC: "75"
      # XUI_MEMORY_RELEASE_INTERVAL: "10"
      # XUI_MEMORY_LIMIT: "400"
      # GOMEMLIMIT: "400MiB"
      # XUI_PPROF: "true"
      # XUI_INIT_WEB_BASE_PATH: "/"
      # XUI_DB_TYPE: "postgres"
      # XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      # Panel web UI (change to match XUI_PORT above).
      - "2054:2054"
    restart: unless-stopped
    # mem_limit: 512m

  postgres:
    image: postgres:16-alpine
    container_name: 67xui_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
